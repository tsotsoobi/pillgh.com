// =====================================================
// LIVE STATS — fetches from Firebase, falls back gracefully
// =====================================================
const FALLBACK_STATS = { rating: 4.8, ratings_count: 43, pi_staked: 40745.13 };

function formatPiStaked(n) {
  if (n == null || isNaN(n)) return "—";
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return Math.round(n).toString();
}

function GyemaStats() {
  const [stats, setStats] = useState(FALLBACK_STATS);

  useEffect(() => {
    if (!window.__db) return;
    const ref = window.__db.ref('stats');
    const unsub = ref.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && typeof data.rating === 'number') {
        setStats({
          rating: data.rating,
          ratings_count: data.ratings_count,
          pi_staked: data.pi_staked
        });
      }
    }, (err) => {
      console.warn('Firebase read failed, using fallback:', err);
    });
    return () => ref.off('value', unsub);
  }, []);

  return (
    <div className="grid grid-cols-3 gap-2 sm:gap-3 mb-7">
      <a
        href="https://ecosystem.pinet.com"
        target="_blank"
        rel="noopener noreferrer"
        title="View Gyema on Pi Ecosystem"
        className="p-3 sm:p-4 rounded-2xl text-center block no-underline transition-transform hover:scale-105 active:scale-95"
        style={{ background: '#F5F0FB' }}
      >
        <div className="text-xl sm:text-2xl font-bold flex items-center justify-center gap-1" style={{ color: '#6B2FBC' }}>
          {stats.rating.toFixed(1)} <span className="text-base sm:text-lg">★</span>
        </div>
        <div className="text-xs text-slate-500 mt-1">{stats.ratings_count} Ratings ↗</div>
      </a>
      <div className="p-3 sm:p-4 rounded-2xl text-center" style={{ background: '#F5F0FB' }}>
        <div className="text-xl sm:text-2xl font-bold" style={{ color: '#6B2FBC' }} title={`${stats.pi_staked.toLocaleString()} Pi staked`}>
          {formatPiStaked(stats.pi_staked)}
        </div>
        <div className="text-xs text-slate-500 mt-1">Pi Staked</div>
      </div>
      <div className="p-3 sm:p-4 rounded-2xl text-center" style={{ background: '#F5F0FB' }}>
        <div className="text-xl sm:text-2xl font-bold" style={{ color: '#6B2FBC' }}>EN</div>
        <div className="text-xs text-slate-500 mt-1">English</div>
      </div>
    </div>
  );
}

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

        setStats(d);
        setRating(d.rating != null ? String(d.rating) : '');
        setRatingsCount(d.ratings_count != null ? String(d.ratings_count) : '');
        setPiStaked(d.pi_staked != null ? String(d.pi_staked) : '');
      }
    });
  }, [authed]);

  async function tryAuth() {
    setAuthError('');
    const hash = await sha256Hex(passInput);
    if (hash === PASSKEY_HASH) {
      setAuthed(true);
    } else {
      setAuthError('Incorrect passkey. Try again.');
      setPassInput('');
    }
  }

  async function saveStats() {
    setSaving(true);
    setSaveMsg('');
    const r = parseFloat(rating);
    const rc = parseInt(ratingsCount, 10);
    const ps = parseFloat(piStaked);

    if (isNaN(r) || r < 0 || r > 5) { setSaveMsg('❌ Rating must be a number between 0 and 5.'); setSaving(false); return; }
    if (isNaN(rc) || rc < 0) { setSaveMsg('❌ Ratings count must be a non-negative number.'); setSaving(false); return; }
    if (isNaN(ps) || ps < 0) { setSaveMsg('❌ Pi staked must be a non-negative number.'); setSaving(false); return; }

    try {
      await window.__db.ref('stats').set({
        rating: r,
        ratings_count: rc,
        pi_staked: ps,
        updated_at: Date.now()
      });
      setSaveMsg('✅ Saved! Stats are now live on pillgh.com.');
      setStats({ rating: r, ratings_count: rc, pi_staked: ps });
    } catch (err) {
      setSaveMsg('❌ Save failed: ' + (err.message || 'unknown error'));
    }
    setSaving(false);
  }

  if (!authed) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6" style={{ background: 'linear-gradient(135deg, #0F1A33 0%, #1B2D5B 100%)' }}>

            onKeyDown={(e) => e.key === 'Enter' && tryAuth()}

            autoFocus
          />
          {authError && <div className="text-sm text-red-600 mb-3">{authError}</div>}
          <button
            onClick={tryAuth}
            disabled={!passInput}
            className="w-full px-6 py-3 rounded-2xl font-bold text-white transition-all"
            style={{ background: passInput ? '#6B2FBC' : '#A78BC9', opacity: passInput ? 1 : 0.6 }}

          <a href="/" className="block text-center text-sm text-slate-500 mt-4 hover:text-slate-700">← Back to pillgh.com</a>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen p-6" style={{ background: 'linear-gradient(135deg, #0F1A33 0%, #1B2D5B 100%)' }}>

              </div>
            </div>

          </div>

          <div className="space-y-4 mb-6">
            <div>
              <label className="text-xs font-semibold tracking-wide uppercase text-slate-500">Rating (0–5)</label>
              <input
                type="number" step="0.1" min="0" max="5"
                value={rating}
                onChange={(e) => setRating(e.target.value)}
                className="w-full mt-1 px-4 py-3 rounded-2xl border-2 border-slate-200 focus:border-purple-400 focus:outline-none text-lg font-bold"
                style={{ color: '#6B2FBC' }}
              />
            </div>
            <div>

              <input
                type="number" min="0"

              />
            </div>
            <div>

              <input
                type="number" step="0.01" min="0"

                onChange={(e) => setPiStaked(e.target.value)}
                className="w-full mt-1 px-4 py-3 rounded-2xl border-2 border-slate-200 focus:border-purple-400 focus:outline-none text-lg font-bold"
                style={{ color: '#6B2FBC' }}
              />
            </div>
          </div>

          <button
            onClick={saveStats}
            disabled={saving}
            className="w-full px-6 py-4 rounded-2xl font-bold text-white transition-all"
            style={{ background: '#6B2FBC', opacity: saving ? 0.6 : 1 }}
          >
            {saving ? 'Saving...' : 'Update stats'}
          </button>

          {saveMsg && (
            <div className={`mt-4 px-4 py-3 rounded-2xl text-sm ${saveMsg.startsWith('✅') ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}`}>

            </div>
          )}

          <div className="mt-6 pt-6 border-t border-slate-100 text-xs text-slate-500">
            Currently live: <span className="font-mono">{stats.rating}★ · {stats.ratings_count} ratings · {stats.pi_staked.toLocaleString()} Pi</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// Hash-based routing: pillgh.com/#admin → AdminPage, anything else → App
function getRoute() {
  return window.location.hash.replace(/^#\/?/, '').toLowerCase() === 'admin' ? 'admin' : 'home';
}

function Root() {
  const [route, setRoute] = useState(getRoute());
  useEffect(() => {
    const handler = () => setRoute(getRoute());
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);
  return route === 'admin' ? <AdminPage /> : <App />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
